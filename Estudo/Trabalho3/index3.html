<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Trabalho</title>
    <style>
        .JS{
            color: #034210;
        }
        body{
            background-color: #99e5e5;
            color: #110c35;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Relembrando como usar HTML e CSS e <b class="JS">JavaScript</b>.</p>
    <script>
     let nome = prompt("Qual é o seu nome?");
     document.write(`Olá, seu nome tem ${nome.length} letras.<br>`);// o write escreve na tela e o length conta a quantidade de letras
     document.write(`Toma seu nome em minuscula: ${nome. toLowerCase()}.<br>`)// tolowercase transforma todas as letras em minusculas
     document.write(`Aqui está ele na versão maiuscula: ${nome.toUpperCase()}`)// touppercase transforma todas as letras em maiusculas
     

    </script>
</body>
</html>
