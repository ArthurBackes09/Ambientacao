<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiro Trabalho</title>
    <style>
        .JS{
            color: #034210;
        }
        body{
            background-color: #99e5e5;
            color: #110c35;
        }
    </style>
</head>
<body>
    <h1>Olá, mundo!</h1>
    <p>Relembrando como usar HTML e CSS e <b class="JS">JavaScript</b>.</p>
    <script>
        alert("Minha primeira mensagem.");
        let Resposta1 = confirm("Vai lembrar de praticar mais depois?");/* Treinando o uso de comentários */
        if(Resposta1==false){
            alert("calado, vai estudar!");
        }
        let Resposta2 = Number(prompt("Esse é qual trabalho?"));/* Lembrar de colocar o tipo de variavel antes do prompt */
        if(Resposta2==1){
            alert("Sabe muito ");
            }else{
            let Resposta3 = confirm("Tá moscando, quer ficar quenem o Gabs?");/* Não fique quenem o Gabs */
            if(Resposta3 == true){
                alert("Tú ta louco, vai estudar!");
        }}
        
        
    </script>
</body>
</html>
